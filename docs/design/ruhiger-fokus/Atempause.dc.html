<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
.app{
--bg:#F6F4EF;--surface:#FFFFFF;--surface-2:#EEEBE4;--border:#E2DDD3;
--text:#1E2227;--muted:#5C636D;
--accent:#3A5A8A;--accent-text:#2E4B75;--on-accent:#FFFFFF;
--good:#3D7A59;--bad:#A9533A;--warn:#94600F;--streak:#B5652E;
--shadow-1:0 1px 2px rgb(30 34 39 / .05);
--shadow-2:0 8px 24px rgb(30 34 39 / .08);
--shadow-dock:0 -1px 0 var(--border),0 -12px 32px rgb(30 34 39 / .06);
--scrim:rgb(30 34 39 / .32);
--font:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
--font-num:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
-webkit-font-smoothing:antialiased;
}
.app[data-theme="night"]{
--bg:#141619;--surface:#1B1E22;--surface-2:#23272C;--border:#2D3237;
--text:#E9E7E2;--muted:#9DA3AA;
--accent:#8EA8D4;--accent-text:#A8BEE2;--on-accent:#0F1620;
--good:#83B89D;--bad:#E1937D;--warn:#D7B263;--streak:#E0A36F;
--shadow-1:none;--shadow-2:0 8px 24px rgb(0 0 0 / .35);--shadow-dock:0 -1px 0 var(--border);--scrim:rgb(0 0 0 / .55);
}
.app[data-theme="oled"]{
--bg:#000000;--surface:#101214;--surface-2:#181B1F;--border:#24282D;
--text:#E9E7E2;--muted:#9DA3AA;
--accent:#8EA8D4;--accent-text:#A8BEE2;--on-accent:#0F1620;
--good:#83B89D;--bad:#E1937D;--warn:#D7B263;--streak:#E0A36F;
--shadow-1:none;--shadow-2:none;--shadow-dock:0 -1px 0 var(--border);--scrim:rgb(0 0 0 / .7);
}
.app[data-theme="aurora"]{
--bg:#0B0A14;--surface:rgba(255,255,255,.06);--surface-2:rgba(255,255,255,.08);--border:rgba(255,255,255,.12);
--text:#F5F3FF;--muted:#A9A6C4;
--accent:#A78BFA;--accent-text:#C4B5FD;--on-accent:#0B0A14;
--good:#5EEAD4;--bad:#FDA4AF;--warn:#FCD34D;--streak:#FDBA74;
--shadow-1:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.10);
--shadow-2:0 12px 40px rgba(0,0,0,.45);--shadow-dock:inset 0 1px 0 rgba(255,255,255,.12);--scrim:rgb(0 0 0 / .6);
--bg-fill:radial-gradient(110% 55% at 0% 0%,rgba(124,92,255,.42),transparent 62%),radial-gradient(80% 45% at 100% 8%,rgba(34,211,238,.26),transparent 60%),radial-gradient(90% 40% at 60% 105%,rgba(236,72,153,.18),transparent 65%),#0B0A14;
--cta-bg:linear-gradient(135deg,#DDD6FE 0%,#A78BFA 38%,#67E8F9 100%);
--cta-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 8px 32px rgba(139,92,246,.5),0 0 56px rgba(103,232,249,.28);
--cta-gloss:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 52%);
--cta-sheen:sheen 1.4s cubic-bezier(.22,1,.36,1) .5s 1 both;
--hero-bg:linear-gradient(155deg,rgba(167,139,250,.30) 0%,rgba(103,232,249,.10) 55%,rgba(255,255,255,.04) 100%);
--hero-shadow:inset 0 0 0 1px rgba(196,181,253,.30),inset 0 1px 0 rgba(255,255,255,.20),0 16px 48px rgba(124,92,255,.28);
--glow-good:0 0 0 4px rgba(94,234,212,.12),0 0 36px rgba(94,234,212,.42);
--glow-icon:drop-shadow(0 0 6px currentColor);
--text-glow:0 0 28px rgba(167,139,250,.5);
--pill-glow:0 0 18px rgba(167,139,250,.55),inset 0 0 0 1px rgba(196,181,253,.4);
}
.app[data-theme="neon"]{
--bg:#08090A;--surface:#121314;--surface-2:#1B1D1F;--border:#2A2D30;
--text:#F2F4F0;--muted:#9BA19A;
--accent:#D4FF3A;--accent-text:#D4FF3A;--on-accent:#0A0B05;
--good:#3DFFB4;--bad:#FF7A59;--warn:#FFC53D;--streak:#FF4FD8;
--shadow-1:inset 0 0 0 1px #24272A;--shadow-2:0 12px 40px rgba(0,0,0,.6);--shadow-dock:inset 0 1px 0 #2A2D30;--scrim:rgb(0 0 0 / .7);
--bg-fill:radial-gradient(120% 45% at 50% -12%,rgba(212,255,58,.16),transparent 58%),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.3px) 0 0/22px 22px,#08090A;
--cta-bg:linear-gradient(180deg,#E6FF85 0%,#D4FF3A 55%,#B8EE1C 100%);
--cta-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 0 28px rgba(212,255,58,.5),0 0 80px rgba(212,255,58,.2);
--cta-gloss:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 50%);
--cta-sheen:sheen 1.4s cubic-bezier(.22,1,.36,1) .5s 1 both;
--hero-bg:linear-gradient(160deg,rgba(212,255,58,.12) 0%,rgba(18,19,20,1) 58%);
--hero-shadow:inset 0 0 0 1px rgba(212,255,58,.38),0 0 36px rgba(212,255,58,.14);
--glow-good:0 0 0 4px rgba(61,255,180,.12),0 0 36px rgba(61,255,180,.45);
--glow-icon:drop-shadow(0 0 6px currentColor);
--text-glow:0 0 24px rgba(212,255,58,.35);
--pill-glow:0 0 18px rgba(212,255,58,.45),inset 0 0 0 1px rgba(212,255,58,.55);
}
.app{
--bg-fill:var(--bg);--cta-bg:var(--accent);--cta-shadow:var(--shadow-2);--cta-gloss:none;--cta-sheen:none;
--hero-bg:var(--surface);--hero-shadow:var(--shadow-1);--glow-good:none;--glow-icon:none;--text-glow:none;--pill-glow:none;
--accent-soft:color-mix(in srgb,var(--accent) 14%,transparent);
--good-soft:color-mix(in srgb,var(--good) 14%,transparent);
--bad-soft:color-mix(in srgb,var(--bad) 14%,transparent);
--warn-soft:color-mix(in srgb,var(--warn) 14%,transparent);
--glass:color-mix(in srgb,var(--surface) 82%,transparent);
--press:color-mix(in srgb,var(--text) 6%,transparent);
}
.app h1,.app h2,.app h3,.app p{margin:0}
.app ol,.app ul{margin:0;padding:0;list-style:none}
.app button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app a{color:var(--accent-text)}
.app a:hover{color:var(--accent)}
.app :focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent)}
.press{transition:transform 100ms cubic-bezier(.22,1,.36,1),filter 200ms cubic-bezier(.22,1,.36,1)}
.press:active{transform:scale(.97);filter:brightness(.94)}
.cta{position:relative;overflow:hidden;isolation:isolate}
.cta::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--cta-gloss);pointer-events:none;z-index:-1}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);opacity:0;pointer-events:none;animation:var(--cta-sheen)}
@keyframes sheen{0%{left:-60%;opacity:1}100%{left:140%;opacity:1}}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.scroll{scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.rise{animation:rise-in 320ms cubic-bezier(.22,1,.36,1) both}
.sheet{animation:sheet-in 320ms cubic-bezier(.22,1,.36,1) both}
.draw path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 280ms cubic-bezier(.22,1,.36,1) 80ms forwards}
@keyframes rise-in{from{opacity:0;transform:translateY(8px)}}
@keyframes sheet-in{from{opacity:0;transform:translateY(32px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){
.rise,.sheet{animation:fade-in 150ms linear both}
.draw path{animation:none;stroke-dashoffset:0}
.cta::after{animation:none}
}
@keyframes fade-in{from{opacity:0}}
.breathe{animation:breathe 8s cubic-bezier(.65,0,.35,1) infinite}
.inhale{animation:inhale 8s linear infinite}
.exhale{animation:exhale 8s linear infinite}
@keyframes breathe{0%,100%{transform:scale(.6)}50%{transform:scale(1)}}
@keyframes inhale{0%,44%{opacity:1}52%,94%{opacity:0}100%{opacity:1}}
@keyframes exhale{0%,44%{opacity:0}52%,94%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.breathe{animation:none;transform:scale(.8)}}
</style>
</helmet>
