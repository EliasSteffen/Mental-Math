# Website: Typprüfung, Tests, Build und Deploy auf Cloudflare Pages. Das Ziel hängt vom Anlass ab:
#   Pull Request      → Vorschau   https://pr-<nr>.mental-math.pages.dev  (nur PRs aus diesem Repo; Forks: nur Tests)
#   Push auf develop  → Vorschau   https://develop.mental-math.pages.dev  = https://preview.mental-math.elias-steffen.de
#   Push auf main     → Produktion https://mental-math.elias-steffen.de  – nur mit iOS-Build desselben Codes (Release-Gate)
# Vorschauen bauen mit DEPLOY_CHANNEL=preview (noindex, „Vorschau“ unter Profil → Über, eigener Name auf dem
# Home-Bildschirm) und nur mit den PREVIEW_*-Variablen, nie mit den Supabase-Werten der Produktion.
# Einrichtung: README.md → Deployment und → Branches, Vorschau & Release.
name: Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_ios_gate:
        description: 'Nur main: ohne iOS-Build desselben Codes deployen (Notfall)'
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write
  actions: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Produktion nur, wenn genau dieser Code schon als iOS-Build in TestFlight liegt (scripts/release-gate.ts)
  release-gate:
    name: Release-Gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.skip_ios_gate
    uses: ./.github/workflows/release-gate.yml

  deploy:
    needs: [test, release-gate]
    # Gate übersprungen = Vorschau oder Notfall; Pull Requests aus Forks bekommen keine Secrets und damit keine Vorschau
    if: >-
      ${{ !cancelled() && needs.test.result == 'success'
      && (needs.release-gate.result == 'success' || needs.release-gate.result == 'skipped')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.target.outputs.url || steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci

      - name: Ziel bestimmen
        id: target
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            branch="pr-$PR"; channel=preview
          elif [ "$REF_NAME" = main ]; then
            branch=main; channel=production
            echo "url=https://mental-math.elias-steffen.de" >> "$GITHUB_OUTPUT"
          else
            # Branch-Alias wie bei Cloudflare: klein, nur a–z, 0–9 und Bindestrich, höchstens 28 Zeichen
            branch=$(printf '%s' "$REF_NAME" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9-' '-' | cut -c1-28); channel=preview
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Ziel: $channel (Branch-Alias $branch)"

      - name: Bauen (Produktion)
        if: steps.target.outputs.channel == 'production'
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          # Passkeys der iOS-App: erzeugt /.well-known/apple-app-site-association (README → iOS-App)
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: Bauen (Vorschau)
        if: steps.target.outputs.channel == 'preview'
        run: npm run build
        env:
          DEPLOY_CHANNEL: preview
          # Eigenes Supabase-Projekt für Vorschauen; leer = Vorschau ohne Konto und Sync
          PUBLIC_SUPABASE_URL: ${{ vars.PREVIEW_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PREVIEW_SUPABASE_ANON_KEY }}

      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mental-math --branch=${{ steps.target.outputs.branch }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Adresse
        shell: bash
        env:
          CHANNEL: ${{ steps.target.outputs.channel }}
          URL: ${{ steps.target.outputs.url || steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          COMMIT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Deploy ($CHANNEL)"
            echo "- Adresse: $URL"
            echo "- Dieser Commit: $COMMIT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
